# ===================================================================
# Asset 平台 — 部署用 application.yml
# 拷贝到 asset-server.jar 同级的 config/ 目录
# 默认值为 Windows dev 环境，Linux prod 由 start.sh 环境变量覆盖
# ===================================================================

server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: asset-service

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:100MB}
      max-request-size: ${FILE_MAX_SIZE:100MB}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:asset_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    enabled: ${REDIS_ENABLED:false}

  data:
    solr:
      host: ${SOLR_HOST:http://localhost:8983/solr}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.asset.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

file:
  upload-dir: ${FILE_UPLOAD_DIR:D:/data/asset_files}
  recycle-bin-dir: ${FILE_RECYCLE_DIR:D:/data/asset_recycle_bin}

storage:
  location:
    public: uploads/public
    internal: uploads/internal
    confidential: uploads/confidential

auth:
  verify-internal-password: ${AUTH_VERIFY_INTERNAL:false}
  token-expiration-hours: ${AUTH_TOKEN_EXPIRATION:24}
  secret-key: ${AUTH_SECRET_KEY:asset-management-secret-key-2026}
  user-source: ${AUTH_USER_SOURCE:asset}
  aes-key: ${AUTH_AES_KEY:ihaierForTodoKey}
  aes-iv: ${AUTH_AES_IV:ihaierForTodo_Iv}
