# ===================================================
# Asset 平台 Linux Nginx 配置
# 用途：托管前端静态文件 + 反向代理后端 API
# 部署路径：/usr/local/nginx/conf/conf.d/nginx-asset-lan.conf
# 生效命令：nginx -t && nginx -s reload
# ===================================================

server {
    listen       8085;                         # 前端统一入口端口
    server_name  22.188.9.15;

    # 允许大文件上传（默认 1M，此处放开到 500M）
    client_max_body_size 500m;

    # ========================================================
    # 1. 前端静态文件（Vue SPA History 模式）
    #    root 指向 build-web-lan.bat 产物上传目录
    # ========================================================
    root   /app/asset-web;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;     # Vue Router history 回退
    }

    # ========================================================
    # 2. 反向代理后端 Java API
    #    后端部署在 22.188.9.15:8095 (Spring Boot)
    # ========================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8095/api/;

        # HTTP/1.1 支持 chunked encoding，大文件流式上传/下载必备
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件传输超时放宽至 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 流式接口 + 文件下载必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }
}
