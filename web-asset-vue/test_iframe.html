<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Iframe 模拟测试</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #eee; }
        /* 模拟主网站的左侧菜单栏 */
        .sidebar { width: 240px; background: #304156; color: white; display: flex; align-items: center; justify-content: center; }
        /* 模拟主网站的右侧内容区 */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="sidebar">主网站侧边栏 (240px)</div>
    <div class="main-content">
        <!-- 将 src 指向你本地运行的 Vue 项目地址（通常是 localhost:8080） -->
        <iframe src="http://localhost:9001"></iframe>
    </div>
</body>
</html>
